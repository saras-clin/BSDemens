      style: "docked"
      collapse-level: 1
      contents:
        - en/index.qmd

  page-footer:
    center: "Steno Diabetes Center Aarhus — Projekt 708421"

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    toc-title: "På denne side"
